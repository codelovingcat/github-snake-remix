name: Generate GitHub Snake

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: snake-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Generate snake
        env:
          CONTRIBUTION_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          SNAKE_OUTPUT: output/snake.gif
          SNAKE_MAX_BYTES: 5000000
        run: npm run generate

      - name: Publish generated artifact
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p output-branch

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git worktree add --detach output-branch origin/output
          else
            git worktree add --detach output-branch
            git -C output-branch checkout --orphan output
            git -C output-branch rm -rf . >/dev/null 2>&1 || true
          fi

          rm -f output-branch/snake.gif
          cp output/snake.gif output-branch/snake.gif
          git -C output-branch add snake.gif
          git -C output-branch commit -m "chore: publish snake artifact" || true
          git -C output-branch push origin HEAD:output
