name: Generate GitHub Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate snake
        env:
          CONTRIBUTION_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          SNAKE_OUTPUT: output/snake.gif
        run: npm run generate

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-gif
          path: output/snake.gif
          if-no-files-found: error
